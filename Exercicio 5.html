<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 05 - Alta Performance</title>
</head>

<body>
    <div>
        Escreva código com JS, diretamente em uma página HTML, para calcular o quadrado da
        soma de três números inteiros.
    </div>

    <script>
        // 1. Entrada de dados: O prompt captura o texto e o parseFloat converte para número decimal.
        const num1 = parseFloat(prompt("Primeiro número: "));
        const num2 = parseFloat(prompt("Segundo número: "));
        const num3 = parseFloat(prompt("Terceiro número: "));

        /**
         * Função para calcular o quadrado da soma.
         * Utiliza o operador de exponenciação (**) do ES6+, que é mais performático que Math.pow().
         */
        function calcQuadrado() {
            // 2. Processamento:
            // O operador '** 2' eleva a soma ao quadrado de forma mais direta e elegante.
            const soma = num1 + num2 + num3;
            const resultado = (soma ** 2).toFixed(1);

            // 3. Alerta de feedback ao usuário.
            alert(`O quadrado da soma é: ${resultado}`);

            // 4. Escrita no documento:
            // Substituímos a concatenação antiga por Template Literals (crases).
            // Isso permite escrever o HTML de forma fluida e inserir variáveis com ${}.
            document.write(`
                <br/>O quadrado da soma de 
                <strong>${num1}, ${num2} e ${num3}</strong> 
                é: <strong>${resultado}</strong>
            `);
        }

        // 5. Inocação da função principal.
        calcQuadrado();

    </script>
</body>

</html>
