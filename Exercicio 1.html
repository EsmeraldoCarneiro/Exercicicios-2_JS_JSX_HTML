<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 01</title>
</head>
<body>
    <div>Escreva código com JS, diretamente em uma página HTML, para somar dois números.</div>
    
    <div id="root"></div>

    <script>
        // Captura de dados: o prompt sempre retorna uma String (texto)
        var num1 = prompt("Informe o primeiro valor: ");
        var num2 = prompt("Informe o segundo valor: ");

        function soma() {
            // Conversão: parseFloat transforma o texto em número decimal para permitir a conta matemática
            var res = parseFloat(num1) + parseFloat(num2);

            // Exibe o resultado em uma janela de alerta
            alert("Total: " + res);            
           
            // Escreve o resultado diretamente na página HTML. 
            // Cuidado: document.write pode substituir todo o conteúdo da página se usado após o carregamento.
            document.write('<br/>A soma dos números <strong>' + num1 + ' e ' + num2 + '</strong> é: <strong>' + res + '</strong>');
        }

        // Execução da função
        soma();
    </script>
</body>
</html>
