<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 03</title>
</head>

<body>
    <div>
        Escreva código com JS, diretamente em uma página HTML, para calcular a média
        aritmética de três notas.
    </div>

    <script>
        // 1. Entrada de dados: O prompt solicita as notas ao usuário.
        // O parseFloat é essencial para converter o texto (String) em números decimais.
        var n1 = parseFloat(prompt("Informe a primeira nota: "));
        var n2 = parseFloat(prompt("Informe a segunda nota: "));
        var n3 = parseFloat(prompt("Informe a terceira nota: "));

        /**
         * Função que realiza o processamento da média e exibe o resultado.
         */
        function mediaAritimetica() {

            // 2. Cálculo: Soma-se as três notas e divide-se por 3.
            // O .toFixed(1) limita o resultado a apenas uma casa decimal.
            var calc = ((n1 + n2 + n3) / 3).toFixed(1);

            // 3. Saída via Alerta: Exibe uma janela pop-up com o resultado.
            alert('Média geral: ' + calc);
            
            // 4. Saída via Documento: Escreve o resultado diretamente no corpo do HTML.
            // Note que aqui as variáveis n1, n2 e n3 são concatenadas para mostrar os valores digitados.
            document.write('<br/>A média aritmética das três notas <strong>' + n1 + ', ' + n2 + ' e ' + n3 + '</strong> é: <strong>' + calc + '</strong>');
        }

        // 5. Chamada da função: Inicia a execução da lógica definida acima.
        mediaAritimetica();

    </script>
</body>

</html>
